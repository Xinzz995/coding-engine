  checks_windows-native-standard-user:
    name: checks / windows-native-standard-user
    needs: plan
    if: ${{ needs.plan.outputs.job_7 == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'toolchain / node 22'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: 'setup / 1'
        working-directory: '.'
        timeout-minutes: 10
        shell: pwsh
        run: '& ''npm'' ''ci'''
      - name: 'build / windows-supervisor-reproducibility'
        if: ${{ needs.plan.outputs.check_6 == 'true' }}
        working-directory: '.'
        timeout-minutes: 10
        shell: pwsh
        run: '& ''pwsh'' ''-NoLogo'' ''-NoProfile'' ''-NonInteractive'' ''-ExecutionPolicy'' ''Bypass'' ''-File'' ''native/windows-supervisor/build.ps1'' ''-Mode'' ''Verify'' ''-CommittedExecutable'' ''assets/workspace-safety/coding-x-windows-supervisor.exe'''
      - name: 'build / windows-path-inspector-reproducibility'
        if: ${{ needs.plan.outputs.check_7 == 'true' }}
        working-directory: '.'
