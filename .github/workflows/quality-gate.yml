            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_10=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- 'src/**' 'eslint.config.js' 'tsconfig.json'; then
            check_10=false
          else
            status=$?
            check_10=true
            if [ "$status" -ne 1 ]; then
              echo "::warning::Git check scope could not be classified; falling back to full"
              full=1
            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_11=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- 'src/**' 'tsconfig.json'; then
            check_11=false
          else
            status=$?
            check_11=true
            if [ "$status" -ne 1 ]; then
              echo "::warning::Git check scope could not be classified; falling back to full"
              full=1
            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_12=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- '.coding-x/**' '.github/ISSUE_TEMPLATE/**' '.github/PULL_REQUEST_TEMPLATE.md' '.github/workflows/**' 'AGENTS.md' 'README.md' 'docs/**' 'src/doctor/repository-health.test.ts'; then
            check_12=false
          else
            status=$?
            check_12=true
            if [ "$status" -ne 1 ]; then
              echo "::warning::Git check scope could not be classified; falling back to full"
              full=1
            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_13=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- 'package.json' 'package-lock.json'; then
            check_13=false
          else
            status=$?
            check_13=true
            if [ "$status" -ne 1 ]; then
              echo "::warning::Git check scope could not be classified; falling back to full"
              full=1
            fi
          fi
          job_1=false
          if [ "$check_1" = true ] || [ "$check_2" = true ] || [ "$check_3" = true ] || [ "$check_5" = true ] || [ "$check_8" = true ] || [ "$check_9" = true ] || [ "$check_10" = true ] || [ "$check_11" = true ] || [ "$check_12" = true ] || [ "$check_13" = true ]; then job_1=true; fi
          job_2=false
          if [ "$check_1" = true ] || [ "$check_5" = true ] || [ "$check_8" = true ]; then job_2=true; fi
          job_3=false
          if [ "$check_1" = true ] || [ "$check_3" = true ] || [ "$check_5" = true ] || [ "$check_8" = true ]; then job_3=true; fi
          job_4=false
          if [ "$check_1" = true ] || [ "$check_5" = true ] || [ "$check_8" = true ]; then job_4=true; fi
          job_5=false
          if [ "$check_1" = true ] || [ "$check_3" = true ] || [ "$check_5" = true ] || [ "$check_8" = true ]; then job_5=true; fi
          job_6=false
