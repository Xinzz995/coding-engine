name: Quality Gate

# Generated from .coding-x/quality.json. Change the contract, then regenerate.
on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks_ubuntu-node-22:
    name: checks / ubuntu-node-22
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'toolchain / node 22'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: 'setup / 1'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''npm'' ''ci'''
      - name: 'setup / 2'
        working-directory: '.'
        timeout-minutes: 2
        shell: bash
        run: '''bash'' ''-c'' ''CODING_X_RUN_LINUX_MOUNT_PROOF=1 npx vitest run src/engine/clean-validation-mounts.test.ts -t ''"''"''rejects a real Linux bind mount before recursive cleanup''"''"'''''
      - name: 'test / tests'
        working-directory: '.'
        timeout-minutes: 30
        shell: bash
        run: '''npm'' ''test'' ''--'' ''--run'''
      - name: 'test / legacy-compatibility'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''npm'' ''run'' ''test:legacy-compat'''
      - name: 'build / build'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''npm'' ''run'' ''build'''
      - name: 'build / cli-smoke'
        working-directory: '.'
        timeout-minutes: 1
        shell: bash
        run: '''node'' ''dist/cli.js'' ''--help'''
      - name: 'static / format'
        working-directory: '.'
        timeout-minutes: 2
        shell: bash
        run: '''npm'' ''run'' ''format:check'''
      - name: 'static / lint'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''npm'' ''run'' ''lint'''
      - name: 'static / typecheck'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''npm'' ''run'' ''typecheck'''
      - name: 'static / repository-health'
        working-directory: '.'
        timeout-minutes: 2
        shell: bash
        run: '''npm'' ''run'' ''repository-health'''
      - name: 'security / dependency-audit'
        working-directory: '.'
        timeout-minutes: 5
        shell: bash
        run: '''npm'' ''audit'' ''--audit-level=high'''
  checks_ubuntu-node-24:
    name: checks / ubuntu-node-24
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'toolchain / node 24'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: 'setup / 1'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''npm'' ''ci'''
      - name: 'test / tests'
        working-directory: '.'
        timeout-minutes: 30
        shell: bash
        run: '''npm'' ''test'' ''--'' ''--run'''
      - name: 'build / build'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''npm'' ''run'' ''build'''
      - name: 'build / cli-smoke'
        working-directory: '.'
        timeout-minutes: 1
        shell: bash
        run: '''node'' ''dist/cli.js'' ''--help'''
  checks_macos-node-24:
    name: checks / macos-node-24
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'toolchain / node 24'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: 'setup / 1'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''npm'' ''ci'''
      - name: 'test / tests'
        working-directory: '.'
        timeout-minutes: 30
        shell: bash
        run: '''npm'' ''test'' ''--'' ''--run'''
      - name: 'test / legacy-compatibility'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''npm'' ''run'' ''test:legacy-compat'''
      - name: 'build / build'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''npm'' ''run'' ''build'''
      - name: 'build / cli-smoke'
        working-directory: '.'
        timeout-minutes: 1
        shell: bash
        run: '''node'' ''dist/cli.js'' ''--help'''
  checks_windows-node-22:
    name: checks / windows-node-22
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'toolchain / node 22'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: 'setup / 1'
        working-directory: '.'
        timeout-minutes: 10
        shell: pwsh
        run: '& ''npm'' ''ci'''
      - name: 'test / tests'
        working-directory: '.'
        timeout-minutes: 30
        shell: pwsh
        run: '& ''npm'' ''test'' ''--'' ''--run'''
      - name: 'test / legacy-compatibility'
        working-directory: '.'
        timeout-minutes: 10
        shell: pwsh
        run: '& ''npm'' ''run'' ''test:legacy-compat'''
      - name: 'build / build'
        working-directory: '.'
        timeout-minutes: 10
        shell: pwsh
        run: '& ''npm'' ''run'' ''build'''
      - name: 'build / cli-smoke'
        working-directory: '.'
        timeout-minutes: 1
        shell: pwsh
        run: '& ''node'' ''dist/cli.js'' ''--help'''
  checks_windows-node-24:
    name: checks / windows-node-24
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'toolchain / node 24'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: 'setup / 1'
        working-directory: '.'
        timeout-minutes: 10
        shell: pwsh
        run: '& ''npm'' ''ci'''
      - name: 'test / tests'
        working-directory: '.'
        timeout-minutes: 30
        shell: pwsh
        run: '& ''npm'' ''test'' ''--'' ''--run'''
      - name: 'build / build'
        working-directory: '.'
        timeout-minutes: 10
        shell: pwsh
        run: '& ''npm'' ''run'' ''build'''
      - name: 'build / cli-smoke'
        working-directory: '.'
        timeout-minutes: 1
        shell: pwsh
        run: '& ''node'' ''dist/cli.js'' ''--help'''
  checks_windows-native-standard-user:
    name: checks / windows-native-standard-user
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'toolchain / node 22'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: 'setup / 1'
        working-directory: '.'
        timeout-minutes: 10
        shell: pwsh
        run: '& ''npm'' ''ci'''
      - name: 'build / windows-supervisor-reproducibility'
        working-directory: '.'
        timeout-minutes: 10
        shell: pwsh
        run: '& ''pwsh'' ''-NoLogo'' ''-NoProfile'' ''-NonInteractive'' ''-ExecutionPolicy'' ''Bypass'' ''-File'' ''native/windows-supervisor/build.ps1'' ''-Mode'' ''Verify'' ''-CommittedExecutable'' ''assets/workspace-safety/coding-x-windows-supervisor.exe'''
      - name: 'build / windows-path-inspector-reproducibility'
        working-directory: '.'
        timeout-minutes: 10
        shell: pwsh
        run: '& ''pwsh'' ''-NoLogo'' ''-NoProfile'' ''-NonInteractive'' ''-ExecutionPolicy'' ''Bypass'' ''-File'' ''native/windows-supervisor/build.ps1'' ''-Mode'' ''Verify'' ''-Target'' ''PathInspector'' ''-CommittedExecutable'' ''assets/workspace-safety/coding-x-windows-path-inspector.exe'''
      - name: 'test / windows-native-proof'
        working-directory: '.'
        timeout-minutes: 30
        shell: pwsh
        run: '& ''npm'' ''run'' ''test:windows-native-proof'''
  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs: [checks_ubuntu-node-22, checks_ubuntu-node-24, checks_macos-node-24, checks_windows-node-22, checks_windows-node-24, checks_windows-native-standard-user]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify every required job completed successfully
        shell: bash
        env:
          RESULT_1: ${{ needs.checks_ubuntu-node-22.result }}
          RESULT_2: ${{ needs.checks_ubuntu-node-24.result }}
          RESULT_3: ${{ needs.checks_macos-node-24.result }}
          RESULT_4: ${{ needs.checks_windows-node-22.result }}
          RESULT_5: ${{ needs.checks_windows-node-24.result }}
          RESULT_6: ${{ needs.checks_windows-native-standard-user.result }}
        run: |
          failed=0
          for result in "${!RESULT_@}"; do
            value="${!result}"
            if [ "$value" != "success" ]; then
              echo "::error::${result}=${value}; required jobs must not fail, cancel, time out, or skip"
              failed=1
            fi
          done
          exit "$failed"
