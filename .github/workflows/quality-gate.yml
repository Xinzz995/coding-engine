          job_7=false
          if [ "$check_6" = true ] || [ "$check_7" = true ] || [ "$check_4" = true ]; then job_7=true; fi
          if [ "$full" -eq 1 ]; then full_value=true; else full_value=false; fi
          echo "full=$full_value" >> "$GITHUB_OUTPUT"
          echo "check_1=$check_1" >> "$GITHUB_OUTPUT"
          echo "check_2=$check_2" >> "$GITHUB_OUTPUT"
          echo "check_3=$check_3" >> "$GITHUB_OUTPUT"
          echo "check_4=$check_4" >> "$GITHUB_OUTPUT"
          echo "check_5=$check_5" >> "$GITHUB_OUTPUT"
          echo "check_6=$check_6" >> "$GITHUB_OUTPUT"
          echo "check_7=$check_7" >> "$GITHUB_OUTPUT"
          echo "check_8=$check_8" >> "$GITHUB_OUTPUT"
