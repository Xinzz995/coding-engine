          echo "check_11=$check_11" >> "$GITHUB_OUTPUT"
          echo "check_12=$check_12" >> "$GITHUB_OUTPUT"
          echo "check_13=$check_13" >> "$GITHUB_OUTPUT"
          echo "job_1=$job_1" >> "$GITHUB_OUTPUT"
          echo "job_2=$job_2" >> "$GITHUB_OUTPUT"
          echo "job_3=$job_3" >> "$GITHUB_OUTPUT"
          echo "job_4=$job_4" >> "$GITHUB_OUTPUT"
          echo "job_5=$job_5" >> "$GITHUB_OUTPUT"
