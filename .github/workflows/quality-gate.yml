        timeout-minutes: 30
        shell: pwsh
        run: '& ''npm'' ''run'' ''test:windows-native-proof'''
  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs: [plan, checks_ubuntu-node-22, checks_ubuntu-node-24, checks_macos-node-22, checks_macos-node-24, checks_windows-node-22, checks_windows-node-24, checks_windows-native-standard-user]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify every required job completed successfully
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RESULT_1: ${{ needs.checks_ubuntu-node-22.result }}
          EXPECTED_1: ${{ needs.plan.outputs.job_1 }}
          RESULT_2: ${{ needs.checks_ubuntu-node-24.result }}
          EXPECTED_2: ${{ needs.plan.outputs.job_2 }}
          RESULT_3: ${{ needs.checks_macos-node-22.result }}
          EXPECTED_3: ${{ needs.plan.outputs.job_3 }}
          RESULT_4: ${{ needs.checks_macos-node-24.result }}
          EXPECTED_4: ${{ needs.plan.outputs.job_4 }}
          RESULT_5: ${{ needs.checks_windows-node-22.result }}
          EXPECTED_5: ${{ needs.plan.outputs.job_5 }}
          RESULT_6: ${{ needs.checks_windows-node-24.result }}
          EXPECTED_6: ${{ needs.plan.outputs.job_6 }}
          RESULT_7: ${{ needs.checks_windows-native-standard-user.result }}
          EXPECTED_7: ${{ needs.plan.outputs.job_7 }}
        run: |
          failed=0
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::plan=${PLAN_RESULT}; change plan must complete successfully"
            failed=1
          fi
          for expected in "${!EXPECTED_@}"; do
            suffix="${expected#EXPECTED_}"
            result="RESULT_${suffix}"
            expected_value="${!expected}"
            result_value="${!result}"
            if [ "$expected_value" != "true" ] && [ "$expected_value" != "false" ]; then
              echo "::error::${expected}=${expected_value}; plan output must be true or false"
              failed=1
            elif { [ "$expected_value" = "true" ] && [ "$result_value" != "success" ]; } ||
                 { [ "$expected_value" = "false" ] && [ "$result_value" != "skipped" ]; }; then
              echo "::error::${result}=${result_value}, ${expected}=${expected_value}; job result does not match the fail-closed plan"
              failed=1
            fi
          done
          exit "$failed"
