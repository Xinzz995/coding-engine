  checks_windows-node-24:
    name: checks / windows-node-24
    needs: plan
    if: ${{ needs.plan.outputs.job_6 == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
