            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_6=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- '.gitattributes' 'native/windows-supervisor/**' 'assets/workspace-safety/coding-x-windows-supervisor.exe' 'assets/workspace-safety/WindowsSupervisorProgram.cs' 'assets/workspace-safety/WindowsJobSupervisor.cs' 'assets/workspace-safety/WindowsJobProcess.cs' 'assets/workspace-safety/WindowsJobAuthority.cs'; then
            check_6=false
          else
            status=$?
            check_6=true
            if [ "$status" -ne 1 ]; then
              echo "::warning::Git check scope could not be classified; falling back to full"
              full=1
            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_7=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- '.gitattributes' 'native/windows-supervisor/**' 'assets/workspace-safety/coding-x-windows-path-inspector.exe' 'assets/workspace-safety/WindowsPathInspectorProgram.cs' 'assets/workspace-safety/WindowsPathAttributes.cs'; then
            check_7=false
          else
            status=$?
            check_7=true
            if [ "$status" -ne 1 ]; then
              echo "::warning::Git check scope could not be classified; falling back to full"
              full=1
            fi
          fi
          if [ "$full" -eq 1 ]; then
