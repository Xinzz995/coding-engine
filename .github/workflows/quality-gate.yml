          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: 'setup / 1'
        working-directory: '.'
        timeout-minutes: 10
        shell: pwsh
        run: '& ''npm'' ''ci'''
      - name: 'test / tests'
        if: ${{ needs.plan.outputs.check_1 == 'true' }}
        working-directory: '.'
        timeout-minutes: 45
        shell: pwsh
        run: '& ''npm'' ''test'' ''--'' ''--run'''
      - name: 'build / build'
        if: ${{ needs.plan.outputs.check_5 == 'true' }}
        working-directory: '.'
        timeout-minutes: 10
        shell: pwsh
        run: '& ''npm'' ''run'' ''build'''
      - name: 'build / cli-smoke'
        if: ${{ needs.plan.outputs.check_8 == 'true' }}
        working-directory: '.'
