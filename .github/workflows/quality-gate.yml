name: Quality Gate

# Generated from .coding-x/quality.json. Change the contract, then regenerate.
on:
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      check_1: ${{ steps.plan.outputs.check_1 }}
      check_2: ${{ steps.plan.outputs.check_2 }}
      check_3: ${{ steps.plan.outputs.check_3 }}
      check_4: ${{ steps.plan.outputs.check_4 }}
      check_5: ${{ steps.plan.outputs.check_5 }}
      check_6: ${{ steps.plan.outputs.check_6 }}
      check_7: ${{ steps.plan.outputs.check_7 }}
      check_8: ${{ steps.plan.outputs.check_8 }}
      check_9: ${{ steps.plan.outputs.check_9 }}
      check_10: ${{ steps.plan.outputs.check_10 }}
      check_11: ${{ steps.plan.outputs.check_11 }}
      check_12: ${{ steps.plan.outputs.check_12 }}
      check_13: ${{ steps.plan.outputs.check_13 }}
      job_1: ${{ steps.plan.outputs.job_1 }}
      job_2: ${{ steps.plan.outputs.job_2 }}
      job_3: ${{ steps.plan.outputs.job_3 }}
      job_4: ${{ steps.plan.outputs.job_4 }}
      job_5: ${{ steps.plan.outputs.job_5 }}
      job_6: ${{ steps.plan.outputs.job_6 }}
      job_7: ${{ steps.plan.outputs.job_7 }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute fail-closed change plan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          full=0
          diff_base=
          diff_head=
          case "$EVENT_NAME" in
            schedule|workflow_dispatch)
              full=1
              ;;
            pull_request)
              if git cat-file -e "${PR_BASE}^{commit}" 2>/dev/null && git cat-file -e "${PR_HEAD}^{commit}" 2>/dev/null; then
                if diff_base=$(git merge-base "$PR_BASE" "$PR_HEAD"); then
                  diff_head="$PR_HEAD"
                else
                  full=1
                fi
              else
                full=1
              fi
              ;;
            *)
              full=1
              ;;
          esac
          if [ "$full" -eq 0 ]; then
            if git diff --quiet --no-renames "$diff_base" "$diff_head" --; then
              full=1
            else
              status=$?
              if [ "$status" -ne 1 ]; then
                echo "::warning::Git diff could not be classified; falling back to full"
                full=1
              fi
            fi
          fi
          if [ "$full" -eq 0 ]; then
            if git diff --quiet --no-renames "$diff_base" "$diff_head" -- . ':(exclude).coding-x/**' ':(exclude).gitattributes' ':(exclude).github/workflows/**' ':(exclude).prettierrc.json' ':(exclude)AGENTS.md' ':(exclude)README.md' ':(exclude)assets/**' ':(exclude)build/**' ':(exclude)commands/**' ':(exclude)docs/golden-principles.md' ':(exclude)hooks/**' ':(exclude)native/**' ':(exclude)package.json' ':(exclude)package-lock.json' ':(exclude)skills/**' ':(exclude)src/**' ':(exclude)templates/**' ':(exclude)tsconfig.json' ':(exclude)tsup.config.ts' ':(exclude)vitest.config.ts' ':(exclude)src/engine/clean-validation-mounts.test.ts' ':(exclude)src/engine/clean-validation-mounts.ts' ':(exclude)src/workspace-safety/**' ':(exclude)assets/workspace-safety/**' ':(exclude)build/compile-windows-test-fixture.ps1' ':(exclude)build/run-windows-native-proof.ps1' ':(exclude)build/vitest.windows-native.config.mjs' ':(exclude)build/windows-native-proof.mjs' ':(exclude)src/review/temporary-directory.ts' ':(exclude)src/workspace-safety/__fixtures__/**' ':(exclude)src/workspace-safety/windows-*.ts' ':(exclude)src/workspace-safety/delegated-recovery.windows-crash.test.ts' ':(exclude)native/windows-supervisor/**' ':(exclude)assets/workspace-safety/coding-x-windows-supervisor.exe' ':(exclude)assets/workspace-safety/WindowsSupervisorProgram.cs' ':(exclude)assets/workspace-safety/WindowsJobSupervisor.cs' ':(exclude)assets/workspace-safety/WindowsJobProcess.cs' ':(exclude)assets/workspace-safety/WindowsJobAuthority.cs' ':(exclude)assets/workspace-safety/coding-x-windows-path-inspector.exe' ':(exclude)assets/workspace-safety/WindowsPathInspectorProgram.cs' ':(exclude)assets/workspace-safety/WindowsPathAttributes.cs' ':(exclude)*.ts' ':(exclude)*.js' ':(exclude)eslint.config.js' ':(exclude).github/ISSUE_TEMPLATE/**' ':(exclude).github/PULL_REQUEST_TEMPLATE.md' ':(exclude)docs/**' ':(exclude)src/doctor/repository-health.test.ts'; then
              :
            else
              status=$?
              full=1
              if [ "$status" -ne 1 ]; then
                echo "::warning::Git path coverage could not be classified; falling back to full"
              fi
            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_1=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- '.coding-x/**' '.gitattributes' '.github/workflows/**' '.prettierrc.json' 'AGENTS.md' 'README.md' 'assets/**' 'build/**' 'commands/**' 'docs/golden-principles.md' 'hooks/**' 'native/**' 'package.json' 'package-lock.json' 'skills/**' 'src/**' 'templates/**' 'tsconfig.json' 'tsup.config.ts' 'vitest.config.ts'; then
            check_1=false
          else
            status=$?
            check_1=true
            if [ "$status" -ne 1 ]; then
              echo "::warning::Git check scope could not be classified; falling back to full"
              full=1
            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_2=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- 'src/engine/clean-validation-mounts.test.ts' 'src/engine/clean-validation-mounts.ts' 'src/workspace-safety/**' 'package.json' 'package-lock.json' 'vitest.config.ts'; then
            check_2=false
          else
            status=$?
            check_2=true
            if [ "$status" -ne 1 ]; then
              echo "::warning::Git check scope could not be classified; falling back to full"
              full=1
            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_3=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- 'src/workspace-safety/**' 'package.json' 'package-lock.json'; then
            check_3=false
          else
            status=$?
            check_3=true
            if [ "$status" -ne 1 ]; then
              echo "::warning::Git check scope could not be classified; falling back to full"
              full=1
            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_4=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- '.gitattributes' 'assets/workspace-safety/**' 'build/compile-windows-test-fixture.ps1' 'build/run-windows-native-proof.ps1' 'build/vitest.windows-native.config.mjs' 'build/windows-native-proof.mjs' 'vitest.config.ts' 'src/review/temporary-directory.ts' 'src/workspace-safety/__fixtures__/**' 'src/workspace-safety/windows-*.ts' 'src/workspace-safety/delegated-recovery.windows-crash.test.ts'; then
            check_4=false
          else
            status=$?
            check_4=true
            if [ "$status" -ne 1 ]; then
              echo "::warning::Git check scope could not be classified; falling back to full"
              full=1
            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_5=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- 'assets/**' 'build/**' 'commands/**' 'hooks/**' 'package.json' 'package-lock.json' 'skills/**' 'src/**' 'templates/**' 'tsconfig.json' 'tsup.config.ts'; then
            check_5=false
          else
            status=$?
            check_5=true
            if [ "$status" -ne 1 ]; then
              echo "::warning::Git check scope could not be classified; falling back to full"
              full=1
            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_6=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- '.gitattributes' 'native/windows-supervisor/**' 'assets/workspace-safety/coding-x-windows-supervisor.exe' 'assets/workspace-safety/WindowsSupervisorProgram.cs' 'assets/workspace-safety/WindowsJobSupervisor.cs' 'assets/workspace-safety/WindowsJobProcess.cs' 'assets/workspace-safety/WindowsJobAuthority.cs'; then
            check_6=false
          else
            status=$?
            check_6=true
            if [ "$status" -ne 1 ]; then
              echo "::warning::Git check scope could not be classified; falling back to full"
              full=1
            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_7=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- '.gitattributes' 'native/windows-supervisor/**' 'assets/workspace-safety/coding-x-windows-path-inspector.exe' 'assets/workspace-safety/WindowsPathInspectorProgram.cs' 'assets/workspace-safety/WindowsPathAttributes.cs'; then
            check_7=false
          else
            status=$?
            check_7=true
            if [ "$status" -ne 1 ]; then
              echo "::warning::Git check scope could not be classified; falling back to full"
              full=1
            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_8=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- 'assets/**' 'build/**' 'commands/**' 'hooks/**' 'package.json' 'package-lock.json' 'skills/**' 'src/**' 'templates/**' 'tsconfig.json' 'tsup.config.ts'; then
            check_8=false
          else
            status=$?
            check_8=true
            if [ "$status" -ne 1 ]; then
              echo "::warning::Git check scope could not be classified; falling back to full"
              full=1
            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_9=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- 'src/**' 'build/**' 'hooks/**' '*.ts' '*.js'; then
            check_9=false
          else
            status=$?
            check_9=true
            if [ "$status" -ne 1 ]; then
              echo "::warning::Git check scope could not be classified; falling back to full"
              full=1
            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_10=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- 'src/**' 'eslint.config.js' 'tsconfig.json'; then
            check_10=false
          else
            status=$?
            check_10=true
            if [ "$status" -ne 1 ]; then
              echo "::warning::Git check scope could not be classified; falling back to full"
              full=1
            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_11=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- 'src/**' 'tsconfig.json'; then
            check_11=false
          else
            status=$?
            check_11=true
            if [ "$status" -ne 1 ]; then
              echo "::warning::Git check scope could not be classified; falling back to full"
              full=1
            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_12=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- '.coding-x/**' '.github/ISSUE_TEMPLATE/**' '.github/PULL_REQUEST_TEMPLATE.md' '.github/workflows/**' 'AGENTS.md' 'README.md' 'docs/**' 'src/doctor/repository-health.test.ts'; then
            check_12=false
          else
            status=$?
            check_12=true
            if [ "$status" -ne 1 ]; then
              echo "::warning::Git check scope could not be classified; falling back to full"
              full=1
            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_13=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- 'package.json' 'package-lock.json'; then
            check_13=false
          else
            status=$?
            check_13=true
            if [ "$status" -ne 1 ]; then
              echo "::warning::Git check scope could not be classified; falling back to full"
              full=1
            fi
          fi
          if [ "$EVENT_NAME" = pull_request ] && [[ "$PR_HEAD_REF" =~ ^codex/issue-([1-9][0-9]*)$ ]]; then
            issue_number="${BASH_REMATCH[1]}"
            source_path="docs/prds/prd-issue-${issue_number}.md"
            if ! source_size=$(git cat-file -s "${PR_HEAD}:${source_path}" 2>/dev/null); then
              echo "::error::ready Issue branch is missing ${source_path} at the PR head"
              exit 1
            fi
            if ! [[ "$source_size" =~ ^[0-9]+$ ]] || [ "$source_size" -gt 2097152 ]; then
              echo "::error::ready Issue source is empty, oversized, or has an invalid size"
              exit 1
            fi
            if ! source_body=$(git show "${PR_HEAD}:${source_path}" 2>/dev/null); then
              echo "::error::ready Issue source cannot be read from the PR head"
              exit 1
            fi
            execution_header_count=$(grep -c '^> Issue-Execution-Contract-Digest:' <<< "$source_body" || true)
            if [ "$execution_header_count" -ne 1 ]; then
              echo "::error::ready Issue source must contain one execution contract digest; legacy runs need a new Issue"
              exit 1
            fi
            mode_header_count=$(grep -c '^> Issue-Remote-Check-Mode:' <<< "$source_body" || true)
            ids_header_count=$(grep -c '^> Issue-Remote-Check-IDs:' <<< "$source_body" || true)
            if [ "$mode_header_count" -ne 1 ] || [ "$ids_header_count" -ne 1 ]; then
              echo "::error::ready Issue remote check headers must appear exactly once"
              exit 1
            fi
            execution_digest=$(sed -n 's/^> Issue-Execution-Contract-Digest: //p' <<< "$source_body")
            remote_mode=$(sed -n 's/^> Issue-Remote-Check-Mode: //p' <<< "$source_body")
            remote_checks=$(sed -n 's/^> Issue-Remote-Check-IDs: //p' <<< "$source_body")
            if ! [[ "$execution_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::ready Issue execution contract digest is invalid"
              exit 1
            fi
            python3 - "$PR_HEAD" "$source_path" "$execution_digest" "$remote_mode" "$remote_checks" <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          import sys

          head, source_path, expected_digest, expected_mode, expected_ids = sys.argv[1:]
          source = subprocess.check_output(
              ["git", "show", f"{head}:{source_path}"], text=True, encoding="utf-8"
          )
          blocks = re.findall(
              r"^#### Execution Contract\s*\r?\n+```json\s*\r?\n([\s\S]+?)\r?\n```",
              source,
              re.MULTILINE,
          )
          if len(blocks) != 1:
              raise SystemExit("ready Issue source must contain one execution contract block")
          try:
              raw = json.loads(blocks[0])
          except json.JSONDecodeError as error:
              raise SystemExit(f"ready Issue execution contract is invalid JSON: {error}")

          def exact(value, keys, label):
              if not isinstance(value, dict) or set(value) != set(keys):
                  raise SystemExit(f"{label} has an invalid shape")
              return value

          def ids(value, label):
              if (
                  not isinstance(value, list)
                  or any(not isinstance(item, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", item) for item in value)
                  or len(set(value)) != len(value)
              ):
                  raise SystemExit(f"{label} has invalid check ids")
              return value

          root = exact(
              raw,
              ["schemaVersion", "storyAcceptance", "localChecks", "remoteDelivery", "runMetrics"],
              "execution contract",
          )
          if type(root["schemaVersion"]) is not int or root["schemaVersion"] != 1:
              raise SystemExit("ready Issue execution contract schemaVersion is invalid")
          story = exact(root["storyAcceptance"], ["evidenceSource", "network", "criteria"], "storyAcceptance")
          criteria = story["criteria"]
          if (
              story["evidenceSource"] != "validator"
              or story["network"] != "disabled"
              or not isinstance(criteria, list)
              or not criteria
              or any(not isinstance(item, str) or not item or item != item.strip() or len(item) > 4000 for item in criteria)
              or len(set(criteria)) != len(criteria)
          ):
              raise SystemExit("ready Issue storyAcceptance is invalid")
          local = exact(root["localChecks"], ["evidenceSource", "network", "mode", "checkIds"], "localChecks")
          local_ids = ids(local["checkIds"], "localChecks")
          if (
              local["evidenceSource"] != "engine"
              or local["network"] != "current-host"
              or local["mode"] not in ["scoped", "full"]
              or (local["mode"] == "full" and local_ids)
          ):
              raise SystemExit("ready Issue localChecks is invalid")
          remote = exact(root["remoteDelivery"], ["evidenceSource", "network", "mode", "checkIds", "ruleset"], "remoteDelivery")
          remote_ids = ids(remote["checkIds"], "remoteDelivery")
          if (
              remote["evidenceSource"] != "github"
              or remote["network"] != "github-actions"
              or remote["mode"] not in ["scoped", "full"]
              or (remote["mode"] == "full" and remote_ids)
              or remote["ruleset"] != "required"
          ):
              raise SystemExit("ready Issue remoteDelivery is invalid")
          metrics = exact(root["runMetrics"], ["evidenceSource", "metrics"], "runMetrics")
          expected_metrics = ["ready-to-trusted", "active", "waiting", "continuations"]
          if metrics["evidenceSource"] != "engine-clock" or metrics["metrics"] != expected_metrics:
              raise SystemExit("ready Issue runMetrics is invalid")

          normalized = {
              "schemaVersion": 1,
              "storyAcceptance": {"evidenceSource": "validator", "network": "disabled", "criteria": criteria},
              "localChecks": {"evidenceSource": "engine", "network": "current-host", "mode": local["mode"], "checkIds": local_ids},
              "remoteDelivery": {"evidenceSource": "github", "network": "github-actions", "mode": remote["mode"], "checkIds": remote_ids, "ruleset": "required"},
              "runMetrics": {"evidenceSource": "engine-clock", "metrics": expected_metrics},
          }
          payload = json.dumps(
              {"domain": "coding-x-ready-issue-execution-v1", "contract": normalized},
              ensure_ascii=False,
              separators=(",", ":"),
          ).encode("utf-8")
          actual_digest = "sha256:" + hashlib.sha256(payload).hexdigest()
          actual_ids = ",".join(remote_ids) if remote_ids else "-"
          if actual_digest != expected_digest or remote["mode"] != expected_mode or actual_ids != expected_ids:
              raise SystemExit("ready Issue remote headers do not match the execution contract")
          PY
            if [ "$remote_mode" != scoped ]; then
              echo "::error::ready Issue remote mode must be scoped for a pull request"
              exit 1
            fi
            if [ "$remote_checks" != - ]; then
              if ! [[ "$remote_checks" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}(,[A-Za-z0-9][A-Za-z0-9._-]{0,127})*$ ]]; then
                echo "::error::ready Issue remote check ids are invalid"
                exit 1
              fi
              IFS=',' read -r -a remote_check_ids <<< "$remote_checks"
              seen_remote_check_ids=,
              for remote_check_id in "${remote_check_ids[@]}"; do
                case "$seen_remote_check_ids" in
                  *",${remote_check_id},"*)
                    echo "::error::ready Issue remote check id ${remote_check_id} is duplicated"
                    exit 1
                    ;;
                esac
                seen_remote_check_ids="${seen_remote_check_ids}${remote_check_id},"
                case "$remote_check_id" in
                  tests) check_1=true ;;
                  linux-mount-proof) check_2=true ;;
                  legacy-compatibility) check_3=true ;;
                  windows-native-proof) check_4=true ;;
                  build) check_5=true ;;
                  windows-supervisor-reproducibility) check_6=true ;;
                  windows-path-inspector-reproducibility) check_7=true ;;
                  cli-smoke) check_8=true ;;
                  format) check_9=true ;;
                  lint) check_10=true ;;
                  typecheck) check_11=true ;;
                  repository-health) check_12=true ;;
                  dependency-audit) check_13=true ;;
                  *)
                    echo "::error::ready Issue remote check ${remote_check_id} has no declared GitHub job"
                    exit 1
                    ;;
                esac
              done
            fi
          fi
          job_1=false
          if [ "$check_1" = true ] || [ "$check_2" = true ] || [ "$check_3" = true ] || [ "$check_5" = true ] || [ "$check_8" = true ] || [ "$check_9" = true ] || [ "$check_10" = true ] || [ "$check_11" = true ] || [ "$check_12" = true ] || [ "$check_13" = true ]; then job_1=true; fi
          job_2=false
          if [ "$check_1" = true ] || [ "$check_5" = true ] || [ "$check_8" = true ]; then job_2=true; fi
          job_3=false
          if [ "$check_1" = true ] || [ "$check_3" = true ] || [ "$check_5" = true ] || [ "$check_8" = true ]; then job_3=true; fi
          job_4=false
          if [ "$check_1" = true ] || [ "$check_5" = true ] || [ "$check_8" = true ]; then job_4=true; fi
          job_5=false
          if [ "$check_1" = true ] || [ "$check_3" = true ] || [ "$check_5" = true ] || [ "$check_8" = true ]; then job_5=true; fi
          job_6=false
          if [ "$check_1" = true ] || [ "$check_5" = true ] || [ "$check_8" = true ]; then job_6=true; fi
          job_7=false
          if [ "$check_6" = true ] || [ "$check_7" = true ] || [ "$check_4" = true ]; then job_7=true; fi
          if [ "$full" -eq 1 ]; then full_value=true; else full_value=false; fi
          echo "full=$full_value" >> "$GITHUB_OUTPUT"
          echo "check_1=$check_1" >> "$GITHUB_OUTPUT"
          echo "check_2=$check_2" >> "$GITHUB_OUTPUT"
          echo "check_3=$check_3" >> "$GITHUB_OUTPUT"
          echo "check_4=$check_4" >> "$GITHUB_OUTPUT"
          echo "check_5=$check_5" >> "$GITHUB_OUTPUT"
          echo "check_6=$check_6" >> "$GITHUB_OUTPUT"
          echo "check_7=$check_7" >> "$GITHUB_OUTPUT"
          echo "check_8=$check_8" >> "$GITHUB_OUTPUT"
          echo "check_9=$check_9" >> "$GITHUB_OUTPUT"
          echo "check_10=$check_10" >> "$GITHUB_OUTPUT"
          echo "check_11=$check_11" >> "$GITHUB_OUTPUT"
          echo "check_12=$check_12" >> "$GITHUB_OUTPUT"
          echo "check_13=$check_13" >> "$GITHUB_OUTPUT"
          echo "job_1=$job_1" >> "$GITHUB_OUTPUT"
          echo "job_2=$job_2" >> "$GITHUB_OUTPUT"
          echo "job_3=$job_3" >> "$GITHUB_OUTPUT"
          echo "job_4=$job_4" >> "$GITHUB_OUTPUT"
          echo "job_5=$job_5" >> "$GITHUB_OUTPUT"
          echo "job_6=$job_6" >> "$GITHUB_OUTPUT"
          echo "job_7=$job_7" >> "$GITHUB_OUTPUT"
  checks_ubuntu-node-22:
    name: checks / ubuntu-node-22
    needs: plan
    if: ${{ needs.plan.outputs.job_1 == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'toolchain / node 22'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: 'setup / 1'
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''npm'' ''ci'''
      - name: 'test / tests'
        if: ${{ needs.plan.outputs.check_1 == 'true' }}
        working-directory: '.'
        timeout-minutes: 45
        shell: bash
        run: '''npm'' ''test'' ''--'' ''--run'''
      - name: 'test / linux-mount-proof'
        if: ${{ needs.plan.outputs.check_2 == 'true' }}
        working-directory: '.'
        timeout-minutes: 2
        shell: bash
        run: '''bash'' ''-c'' ''CODING_X_RUN_LINUX_MOUNT_PROOF=1 npx vitest run src/engine/clean-validation-mounts.test.ts -t ''"''"''rejects a real Linux bind mount before recursive cleanup''"''"'''''
      - name: 'test / legacy-compatibility'
        if: ${{ needs.plan.outputs.check_3 == 'true' }}
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''npm'' ''run'' ''test:legacy-compat'''
      - name: 'build / build'
        if: ${{ needs.plan.outputs.check_5 == 'true' }}
        working-directory: '.'
        timeout-minutes: 10
        shell: bash
        run: '''npm'' ''run'' ''build'''
      - name: 'build / cli-smoke'
