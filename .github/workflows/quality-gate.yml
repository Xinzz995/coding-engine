name: Quality Gate

# Generated from .coding-x/quality.json. Change the contract, then regenerate.
on:
  pull_request:
  push:
    branches: ['main']
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      check_1: ${{ steps.plan.outputs.check_1 }}
      check_2: ${{ steps.plan.outputs.check_2 }}
      check_3: ${{ steps.plan.outputs.check_3 }}
      check_4: ${{ steps.plan.outputs.check_4 }}
      check_5: ${{ steps.plan.outputs.check_5 }}
      check_6: ${{ steps.plan.outputs.check_6 }}
      check_7: ${{ steps.plan.outputs.check_7 }}
      check_8: ${{ steps.plan.outputs.check_8 }}
      check_9: ${{ steps.plan.outputs.check_9 }}
      check_10: ${{ steps.plan.outputs.check_10 }}
      check_11: ${{ steps.plan.outputs.check_11 }}
      check_12: ${{ steps.plan.outputs.check_12 }}
      check_13: ${{ steps.plan.outputs.check_13 }}
      job_1: ${{ steps.plan.outputs.job_1 }}
      job_2: ${{ steps.plan.outputs.job_2 }}
      job_3: ${{ steps.plan.outputs.job_3 }}
      job_4: ${{ steps.plan.outputs.job_4 }}
      job_5: ${{ steps.plan.outputs.job_5 }}
      job_6: ${{ steps.plan.outputs.job_6 }}
      job_7: ${{ steps.plan.outputs.job_7 }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute fail-closed change plan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          full=0
          diff_base=
          diff_head=
          case "$EVENT_NAME" in
            schedule|workflow_dispatch)
              full=1
              ;;
            pull_request)
              if git cat-file -e "${PR_BASE}^{commit}" 2>/dev/null && git cat-file -e "${PR_HEAD}^{commit}" 2>/dev/null; then
                if diff_base=$(git merge-base "$PR_BASE" "$PR_HEAD"); then
                  diff_head="$PR_HEAD"
                else
                  full=1
                fi
              else
                full=1
              fi
              ;;
            push)
              if [ -z "$PUSH_BEFORE" ] || [[ "$PUSH_BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null || ! git cat-file -e "${PUSH_AFTER}^{commit}" 2>/dev/null; then
                full=1
              else
                diff_base="$PUSH_BEFORE"
                diff_head="$PUSH_AFTER"
              fi
              ;;
            *)
              full=1
              ;;
          esac
          if [ "$full" -eq 0 ]; then
            if git diff --quiet --no-renames "$diff_base" "$diff_head" --; then
              full=1
            else
              status=$?
              if [ "$status" -ne 1 ]; then
                echo "::warning::Git diff could not be classified; falling back to full"
                full=1
              fi
            fi
          fi
          if [ "$full" -eq 0 ]; then
            if git diff --quiet --no-renames "$diff_base" "$diff_head" -- . ':(exclude).coding-x/**' ':(exclude).gitattributes' ':(exclude).github/workflows/**' ':(exclude).prettierrc.json' ':(exclude)AGENTS.md' ':(exclude)README.md' ':(exclude)assets/**' ':(exclude)build/**' ':(exclude)commands/**' ':(exclude)docs/golden-principles.md' ':(exclude)hooks/**' ':(exclude)native/**' ':(exclude)package.json' ':(exclude)package-lock.json' ':(exclude)skills/**' ':(exclude)src/**' ':(exclude)templates/**' ':(exclude)tsconfig.json' ':(exclude)tsup.config.ts' ':(exclude)vitest.config.ts' ':(exclude)src/engine/clean-validation-mounts.test.ts' ':(exclude)src/engine/clean-validation-mounts.ts' ':(exclude)src/workspace-safety/**' ':(exclude)assets/workspace-safety/**' ':(exclude)build/compile-windows-test-fixture.ps1' ':(exclude)build/run-windows-native-proof.ps1' ':(exclude)build/vitest.windows-native.config.mjs' ':(exclude)build/windows-native-proof.mjs' ':(exclude)src/review/temporary-directory.ts' ':(exclude)src/workspace-safety/__fixtures__/**' ':(exclude)src/workspace-safety/windows-*.ts' ':(exclude)src/workspace-safety/delegated-recovery.windows-crash.test.ts' ':(exclude)native/windows-supervisor/**' ':(exclude)assets/workspace-safety/coding-x-windows-supervisor.exe' ':(exclude)assets/workspace-safety/WindowsSupervisorProgram.cs' ':(exclude)assets/workspace-safety/WindowsJobSupervisor.cs' ':(exclude)assets/workspace-safety/WindowsJobProcess.cs' ':(exclude)assets/workspace-safety/WindowsJobAuthority.cs' ':(exclude)assets/workspace-safety/coding-x-windows-path-inspector.exe' ':(exclude)assets/workspace-safety/WindowsPathInspectorProgram.cs' ':(exclude)assets/workspace-safety/WindowsPathAttributes.cs' ':(exclude)*.ts' ':(exclude)*.js' ':(exclude)eslint.config.js' ':(exclude).github/ISSUE_TEMPLATE/**' ':(exclude).github/PULL_REQUEST_TEMPLATE.md' ':(exclude)docs/**' ':(exclude)src/doctor/repository-health.test.ts'; then
              :
            else
              status=$?
              full=1
              if [ "$status" -ne 1 ]; then
                echo "::warning::Git path coverage could not be classified; falling back to full"
              fi
            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_1=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- '.coding-x/**' '.gitattributes' '.github/workflows/**' '.prettierrc.json' 'AGENTS.md' 'README.md' 'assets/**' 'build/**' 'commands/**' 'docs/golden-principles.md' 'hooks/**' 'native/**' 'package.json' 'package-lock.json' 'skills/**' 'src/**' 'templates/**' 'tsconfig.json' 'tsup.config.ts' 'vitest.config.ts'; then
            check_1=false
          else
            status=$?
            check_1=true
            if [ "$status" -ne 1 ]; then
              echo "::warning::Git check scope could not be classified; falling back to full"
              full=1
            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_2=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- 'src/engine/clean-validation-mounts.test.ts' 'src/engine/clean-validation-mounts.ts' 'src/workspace-safety/**' 'package.json' 'package-lock.json' 'vitest.config.ts'; then
            check_2=false
          else
            status=$?
            check_2=true
            if [ "$status" -ne 1 ]; then
              echo "::warning::Git check scope could not be classified; falling back to full"
              full=1
            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_3=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- 'src/workspace-safety/**' 'package.json' 'package-lock.json'; then
            check_3=false
          else
            status=$?
            check_3=true
            if [ "$status" -ne 1 ]; then
              echo "::warning::Git check scope could not be classified; falling back to full"
              full=1
            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_4=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- '.gitattributes' 'assets/workspace-safety/**' 'build/compile-windows-test-fixture.ps1' 'build/run-windows-native-proof.ps1' 'build/vitest.windows-native.config.mjs' 'build/windows-native-proof.mjs' 'vitest.config.ts' 'src/review/temporary-directory.ts' 'src/workspace-safety/__fixtures__/**' 'src/workspace-safety/windows-*.ts' 'src/workspace-safety/delegated-recovery.windows-crash.test.ts'; then
            check_4=false
          else
            status=$?
            check_4=true
            if [ "$status" -ne 1 ]; then
              echo "::warning::Git check scope could not be classified; falling back to full"
              full=1
            fi
          fi
          if [ "$full" -eq 1 ]; then
            check_5=true
          elif git diff --quiet --no-renames "$diff_base" "$diff_head" -- 'assets/**' 'build/**' 'commands/**' 'hooks/**' 'package.json' 'package-lock.json' 'skills/**' 'src/**' 'templates/**' 'tsconfig.json' 'tsup.config.ts'; then
