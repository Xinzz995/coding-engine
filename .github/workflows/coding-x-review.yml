# Managed by coding-x quality init. The workflow runs from the trusted default branch.
name: coding-x quality gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: coding-x-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  project-checks:
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/coding-x-project-checks.yml
    with:
      coding-x-version: "0.30.9"
      base-sha: ${{ github.event.pull_request.base.sha }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      pull-request-number: ${{ github.event.pull_request.number }}
    permissions:
      contents: read

  publish-project-check:
    if: always() && github.event.pull_request.draft == false
    needs: [project-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Publish the exact-head project check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_JOB_RESULT: ${{ needs.project-checks.result }}
        run: >-
          npm exec --yes
          --prefix "$RUNNER_TEMP"
          --package="coding-x@0.30.9"
          -- coding-x quality gate
          --publish-project-check "$PROJECT_JOB_RESULT"
          --event-path "$GITHUB_EVENT_PATH"
          --json

  ai-reviews:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    concurrency:
      group: coding-x-model-${{ github.repository_id }}
      queue: max
    permissions:
      contents: read
      pull-requests: read
      checks: write
      models: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Review Spec against the exact pull request head
        id: spec
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODING_X_MODEL_TOKEN: ${{ secrets.CODING_X_MODEL_TOKEN }}
        run: >-
          npm exec --yes
          --prefix "$RUNNER_TEMP"
          --package="coding-x@0.30.9"
          -- coding-x quality gate
          --axis spec
          --event-path "$GITHUB_EVENT_PATH"
          --json

      - name: Review engineering standards against the exact pull request head
        id: standards
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODING_X_MODEL_TOKEN: ${{ secrets.CODING_X_MODEL_TOKEN }}
        run: >-
          npm exec --yes
          --prefix "$RUNNER_TEMP"
          --package="coding-x@0.30.9"
          -- coding-x quality gate
          --axis standards
          --event-path "$GITHUB_EVENT_PATH"
          --json

      - name: Run risk-triggered structural review
        id: deep
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODING_X_MODEL_TOKEN: ${{ secrets.CODING_X_MODEL_TOKEN }}
        run: >-
          npm exec --yes
          --prefix "$RUNNER_TEMP"
          --package="coding-x@0.30.9"
          -- coding-x quality gate
          --axis deep
          --event-path "$GITHUB_EVENT_PATH"
          --json

      - name: Fail when any independent review axis did not pass
        if: always()
        env:
          SPEC_OUTCOME: ${{ steps.spec.outcome }}
          STANDARDS_OUTCOME: ${{ steps.standards.outcome }}
          DEEP_OUTCOME: ${{ steps.deep.outcome }}
        run: |
          for outcome in "$SPEC_OUTCOME" "$STANDARDS_OUTCOME" "$DEEP_OUTCOME"; do
            if [[ "$outcome" != "success" ]]; then
              exit 1
            fi
          done
