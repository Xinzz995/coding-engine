# Managed by coding-x quality init. The workflow runs from the trusted default branch.
name: coding-x quality gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: coding-x-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  project-checks:
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/coding-x-project-checks.yml
    with:
      coding-x-version: "0.30.1"
      base-sha: ${{ github.event.pull_request.base.sha }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      pull-request-number: ${{ github.event.pull_request.number }}
    permissions:
      contents: read

  publish-project-check:
    if: always() && github.event.pull_request.draft == false
    needs: [project-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Publish the exact-head project check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_JOB_RESULT: ${{ needs.project-checks.result }}
        run: >-
          npm exec --yes
          --prefix "$RUNNER_TEMP/coding-x-runtime"
          --package="coding-x@0.30.1"
          -- coding-x quality gate
          --publish-project-check "$PROJECT_JOB_RESULT"
          --event-path "$GITHUB_EVENT_PATH"
          --json

  spec-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: write
      models: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Review Spec against the exact pull request head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          npm exec --yes
          --prefix "$RUNNER_TEMP/coding-x-runtime"
          --package="coding-x@0.30.1"
          -- coding-x quality gate
          --axis spec
          --event-path "$GITHUB_EVENT_PATH"
          --json

  standards-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: write
      models: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Review engineering standards against the exact pull request head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          npm exec --yes
          --prefix "$RUNNER_TEMP/coding-x-runtime"
          --package="coding-x@0.30.1"
          -- coding-x quality gate
          --axis standards
          --event-path "$GITHUB_EVENT_PATH"
          --json

  deep-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: write
      models: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Run risk-triggered structural review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          npm exec --yes
          --prefix "$RUNNER_TEMP/coding-x-runtime"
          --package="coding-x@0.30.1"
          -- coding-x quality gate
          --axis deep
          --event-path "$GITHUB_EVENT_PATH"
          --json
