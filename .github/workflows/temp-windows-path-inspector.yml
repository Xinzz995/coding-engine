name: TEMP Windows Path Inspector

on:
  pull_request:

permissions:
  contents: read

jobs:
  generate:
    name: generate reviewed Windows path inspector
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate deterministic Windows path inspector
        working-directory: '.'
        timeout-minutes: 10
        shell: pwsh
        run: '& ''pwsh'' ''-NoLogo'' ''-NoProfile'' ''-NonInteractive'' ''-ExecutionPolicy'' ''Bypass'' ''-File'' ''native/windows-supervisor/build.ps1'' ''-Mode'' ''Generate'' ''-Target'' ''PathInspector'' ''-OutputDirectory'' "$env:RUNNER_TEMP\coding-x-path-inspector"'
      - name: Upload deterministic Windows path inspector
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-path-inspector-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/coding-x-path-inspector/*
          if-no-files-found: error
          retention-days: 1
