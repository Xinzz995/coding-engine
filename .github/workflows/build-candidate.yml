name: Build release candidate
run-name: Build coding-x@${{ inputs.version }} candidate from ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable version already merged to main (for example 0.35.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-candidate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: verify and pack exact npm candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Bind candidate to the current protected main commit
        env:
          SELECTED_REF: ${{ github.ref }}
          CANDIDATE_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags origin main
          node build/release-evidence.mjs verify-source \
            --expected-version "$EXPECTED_VERSION" \
            --commit "$CANDIDATE_COMMIT" \
            --ref "$SELECTED_REF" \
            --main-ref refs/remotes/origin/main \
            --require-node-major 24 \
            --min-npm 11.15.0

      - name: Install dependencies without release cache
        run: npm ci

      - name: Run complete release checks
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run repository-health
          node dist/cli.js --help >/dev/null
          npm audit --audit-level=high

      - name: Pack and record the exact candidate bytes
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
          CANDIDATE_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/npm-candidate"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/npm-candidate" \
            > "$RUNNER_TEMP/npm-candidate/pack.json"
          node build/release-evidence.mjs record-pack \
            --expected-version "$EXPECTED_VERSION" \
            --commit "$CANDIDATE_COMMIT" \
            --candidate-workflow-run-id "$CANDIDATE_WORKFLOW_RUN_ID" \
            --require-node-major 24 \
            --min-npm 11.15.0 \
            --pack-json "$RUNNER_TEMP/npm-candidate/pack.json" \
            --tarball "$RUNNER_TEMP/npm-candidate/coding-x-$EXPECTED_VERSION.tgz" \
            --output "$RUNNER_TEMP/npm-candidate/packed.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve candidate for pre-stage verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-candidate-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/npm-candidate/coding-x-${{ inputs.version }}.tgz
            ${{ runner.temp }}/npm-candidate/packed.json
            ${{ runner.temp }}/npm-candidate/pack.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Write candidate verification handoff
        run: |
          node - "$RUNNER_TEMP/npm-candidate/packed.json" "$GITHUB_STEP_SUMMARY" <<'NODE'
          const fs = require('node:fs')
          const [evidencePath, summaryPath] = process.argv.slice(2)
          const evidence = JSON.parse(fs.readFileSync(evidencePath, 'utf8'))
          fs.appendFileSync(summaryPath, [
            '## npm candidate packed; platform installation proof is pending',
            '',
            `- package: ${evidence.packageName}@${evidence.version}`,
            `- commit: ${evidence.commit}`,
            `- candidate run ID: ${evidence.candidateWorkflowRunId}`,
            `- tarball SHA-256: ${evidence.tarball.sha256}`,
            '',
            'This workflow is not successful until the same tarball installs on all three platforms.',
            '',
          ].join('\n'))
          NODE

  platform_install:
    name: install exact candidate (${{ matrix.platform }}, Node 22)
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: macos-26
            platform: macos
          - os: windows-2022
            platform: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download the one candidate artifact from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-candidate-${{ inputs.version }}
          path: ${{ runner.temp }}/npm-candidate

      - name: Verify the downloaded tarball against packed evidence
        run: >-
          node build/release-evidence.mjs verify-tarball
          --evidence "${{ runner.temp }}/npm-candidate/packed.json"
          --tarball "${{ runner.temp }}/npm-candidate/coding-x-${{ inputs.version }}.tgz"

      - name: Install and run the exact candidate through its npm command entry
        run: >-
          node build/candidate-install-smoke.mjs
          --evidence "${{ runner.temp }}/npm-candidate/packed.json"
          --tarball "${{ runner.temp }}/npm-candidate/coding-x-${{ inputs.version }}.tgz"
          --expected-version "${{ inputs.version }}"
          --expected-commit "${{ github.sha }}"
          --candidate-workflow-run-id "${{ github.run_id }}"
          --expected-platform "${{ matrix.platform }}"
          --project-root "${{ github.workspace }}"
          --temp-root "${{ runner.temp }}"

  candidate_ready:
    name: candidate install gate
    needs: [prepare, platform_install]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Accept only successful preparation and three-platform installation
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          PLATFORM_RESULT: ${{ needs.platform_install.result }}
        run: |
          echo "prepare=$PREPARE_RESULT"
          echo "platform_install=$PLATFORM_RESULT"
          if [ "$PREPARE_RESULT" != "success" ] || [ "$PLATFORM_RESULT" != "success" ]; then
            exit 1
          fi
          echo "The exact candidate installed on Linux, macOS, and Windows." >> "$GITHUB_STEP_SUMMARY"
          echo "Run coding-engine, Go, and Python Dogfood with this exact artifact before staging." >> "$GITHUB_STEP_SUMMARY"
