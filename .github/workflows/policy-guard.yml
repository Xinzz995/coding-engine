name: Policy Guard

# Generated from the default branch quality contract. Change the contract, then regenerate.
# Runs from the default branch. Never check out or execute pull request content here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions: {}

jobs:
  policy-guard:
    name: policy-guard-source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Check protected policy changes through the GitHub API
        id: evaluate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import fnmatch
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          protected = [".coding-x/**",".github/dependabot.yml",".github/workflows/**",".github/workflows/publish.yml",".github/workflows/stage-candidate.yml",".prettierrc.json","AGENTS.md","docs/architecture.md","docs/golden-principles.md","docs/patterns.md","eslint.config.js","package-lock.json","package.json","src/doctor/repository-health.test.ts"]
          max_days = 7
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          repo = event["repository"]["full_name"]
          number = event["number"]
          token = os.environ["GH_TOKEN"]

          def api(path):
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + token,
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "coding-x-policy-guard",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          # opened/labeled can race: the event payload is an immutable snapshot, so policy
          # decisions must read the current labels and body from GitHub.
          pr = api(f"/repos/{repo}/pulls/{number}")
          changed_files = pr.get("changed_files")
          if (
              isinstance(changed_files, bool)
              or not isinstance(changed_files, int)
              or changed_files < 0
          ):
              raise SystemExit("GitHub PR changed_files is missing or invalid")
          # GitHub's pull-request-files API exposes at most 3000 entries. At the
          # boundary we cannot prove that every changed path was returned, so a
          # policy decision must fail closed and require a smaller PR.
          if changed_files >= 3000:
              raise SystemExit(
                  "Policy Guard cannot verify pull requests with 3000 or more changed files; "
                  "split the pull request"
              )

          file_entries = []
          page = 1
          while True:
              batch = api(f"/repos/{repo}/pulls/{number}/files?per_page=100&page={page}")
              if not isinstance(batch, list):
                  raise SystemExit("GitHub pull request files response is invalid")
              file_entries.extend(batch)
              if len(file_entries) > changed_files:
                  raise SystemExit(
                      "GitHub pull request files response exceeds declared changed_files"
                  )
              if len(batch) < 100:
                  break
              page += 1

          if len(file_entries) != changed_files:
              raise SystemExit(
                  "GitHub pull request files response is incomplete: "
                  f"expected {changed_files}, received {len(file_entries)}"
              )

          files = set()
          for item in file_entries:
              if not isinstance(item, dict):
                  raise SystemExit("GitHub pull request files response contains an invalid item")
              filename = item.get("filename")
              if not isinstance(filename, str) or not filename:
                  raise SystemExit("GitHub pull request file is missing filename")
              files.add(filename)
              # For a rename, GitHub's filename is the destination. The source
              # must be checked too, otherwise moving a protected policy file to
              # an ordinary path silently evades the old-rule guard.
              previous_filename = item.get("previous_filename")
              if previous_filename is not None:
                  if not isinstance(previous_filename, str) or not previous_filename:
                      raise SystemExit(
                          "GitHub pull request file contains an invalid previous_filename"
                      )
                  files.add(previous_filename)

          changed = sorted({
              path for path in files
              if any(fnmatch.fnmatchcase(path, pattern) for pattern in protected)
          })
          if not changed:
              print("No protected policy paths changed")
              raise SystemExit(0)

          labels = {item["name"] for item in pr.get("labels", [])}
          if "quality-policy-approved" not in labels:
              raise SystemExit(
                  "Protected policy changed without owner label quality-policy-approved: "
                  + ", ".join(changed)
              )

          body = pr.get("body") or ""
          match = re.search(r"(?im)^Policy-Exception:\s*#(\d+)\s*$", body)
          if not match:
              raise SystemExit("PR body must contain: Policy-Exception: #<issue>")
          issue_number = int(match.group(1))
          issue = api(f"/repos/{repo}/issues/{issue_number}")
          if "pull_request" in issue or issue.get("state") != "open":
              raise SystemExit("Policy exception must reference an open Issue")
          issue_labels = {item["name"] for item in issue.get("labels", [])}
          if "quality-policy-exception" not in issue_labels:
              raise SystemExit("Referenced Issue is not a quality-policy-exception")

          issue_body = issue.get("body") or ""
          def section(name):
              found = re.search(
                  rf"(?ms)^### {re.escape(name)}\s*\n(.*?)(?=^### |\Z)", issue_body
              )
              value = found.group(1).strip() if found else ""
              return "" if value in {"", "_No response_"} else value

          owner = section("负责人")
          reason = section("原因")
          expires_raw = section("到期日")
          follow_up = section("跟进事项")
          if not all([owner, reason, expires_raw, follow_up]):
              raise SystemExit("Policy exception Issue is missing owner, reason, expiry, or follow-up")
          try:
              expires = dt.date.fromisoformat(expires_raw)
          except ValueError:
              raise SystemExit("Policy exception expiry must be YYYY-MM-DD")
          today = dt.datetime.now(dt.timezone.utc).date()
          if expires < today or expires > today + dt.timedelta(days=max_days):
              raise SystemExit(f"Policy exception expiry must be within {max_days} days")

          print("Approved protected policy change:", ", ".join(changed))
          print(f"Exception issue #{issue_number}; owner={owner}; expires={expires}")
          PY
