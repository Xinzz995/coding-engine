# Managed by coding-x quality init.
name: coding-x quality drift

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  doctor:
    name: coding-x / quality-doctor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify local and remote quality controls
        env:
          GH_TOKEN: ${{ secrets.CODING_X_ADMIN_TOKEN || github.token }}
        run: >-
          npm exec --yes
          --prefix "$RUNNER_TEMP"
          --package="coding-x@0.31.2"
          -- coding-x quality doctor
          --remote
          --json
