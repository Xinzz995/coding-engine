# Managed by coding-x quality init.
name: coding-x quality drift

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  doctor:
    name: coding-x / quality-doctor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Verify local and remote quality controls
        env:
          GH_TOKEN: ${{ secrets.CODING_X_ADMIN_TOKEN || github.token }}
        run: >-
          npm exec --yes
          --prefix "$RUNNER_TEMP"
          --package="coding-x@0.31.2"
          -- coding-x quality doctor
          --remote
          --json
