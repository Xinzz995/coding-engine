name: Verify stable npm release

# The maintainer creates and pushes an annotated vX.Y.Z tag only after:
# 1. npm stage approval published the exact candidate to next;
# 2. three real projects passed exact-version registry smoke tests;
# 3. the maintainer moved latest to the same version with 2FA.
# This workflow never publishes to npm and never uses an npm token.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to recover or re-verify (vX.Y.Z)
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: verify registry candidate and publish immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify annotated tag and protected main ancestry
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RUN_REF: ${{ github.ref }}
          RUN_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags origin main
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            if [ "$RUN_REF" != refs/heads/main ] || [ "$RUN_COMMIT" != "$(git rev-parse refs/remotes/origin/main)" ]; then
              echo "::error::Manual recovery must run from the current main branch"
              exit 1
            fi
          elif [ "$RUN_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "::error::Tag-triggered release is not bound to refs/tags/$RELEASE_TAG"
            exit 1
          fi
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          RELEASE_COMMIT="$(git rev-parse "$RELEASE_TAG^{commit}")"
          node build/release-evidence.mjs verify-tag \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --main-ref refs/remotes/origin/main \
            --output "$RUNNER_TEMP/release-tag.json"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "stage_run_id=$(jq -r .stageRunId "$RUNNER_TEMP/release-tag.json")" >> "$GITHUB_OUTPUT"
          echo "stage_id=$(jq -r .stageId "$RUNNER_TEMP/release-tag.json")" >> "$GITHUB_OUTPUT"
          echo "tarball_sha256=$(jq -r .tarballSha256 "$RUNNER_TEMP/release-tag.json")" >> "$GITHUB_OUTPUT"

      - name: Verify the exact stage run recorded by the immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
          STAGE_RUN_ID: ${{ steps.source.outputs.stage_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGE_RUN_ID" \
            > "$RUNNER_TEMP/stage-run.json"
          jq -e --arg sha "$RELEASE_COMMIT" '
            .id == ($ENV.STAGE_RUN_ID | tonumber) and
            .head_sha == $sha and
            .head_branch == "main" and
            .event == "workflow_dispatch" and
            .status == "completed" and
            .conclusion == "success" and
            .path == ".github/workflows/stage-candidate.yml"
          ' "$RUNNER_TEMP/stage-run.json" >/dev/null

      - name: Download the pre-stage candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-candidate-${{ steps.source.outputs.version }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.stage_run_id }}

      - name: Download the stage identity artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-stage-${{ steps.source.outputs.version }}
          path: ${{ runner.temp }}/stage
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.stage_run_id }}

      - name: Verify candidate artifact and public npm state
        env:
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
          STAGE_RUN_ID: ${{ steps.source.outputs.stage_run_id }}
          NPM_STAGE_ID: ${{ steps.source.outputs.stage_id }}
          CANDIDATE_SHA256: ${{ steps.source.outputs.tarball_sha256 }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/registry"
          node build/release-evidence.mjs verify-tarball \
            --evidence "$RUNNER_TEMP/stage/candidate.json" \
            --tarball "$RUNNER_TEMP/candidate/coding-x-$VERSION.tgz"
          npm view "coding-x@$VERSION" --json > "$RUNNER_TEMP/registry/metadata.json"
          npm view coding-x dist-tags --json > "$RUNNER_TEMP/registry/dist-tags.json"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "https://registry.npmjs.org/coding-x/-/coding-x-$VERSION.tgz" \
            --output "$RUNNER_TEMP/registry/coding-x-$VERSION.tgz"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "https://registry.npmjs.org/-/npm/v1/attestations/coding-x@$VERSION" \
            --output "$RUNNER_TEMP/registry/attestations.json"
          node build/release-evidence.mjs verify-registry \
            --evidence "$RUNNER_TEMP/stage/candidate.json" \
            --commit "$RELEASE_COMMIT" \
            --workflow-run-id "$STAGE_RUN_ID" \
            --stage-id "$NPM_STAGE_ID" \
            --tarball-sha256 "$CANDIDATE_SHA256" \
            --metadata "$RUNNER_TEMP/registry/metadata.json" \
            --dist-tags "$RUNNER_TEMP/registry/dist-tags.json" \
            --attestations "$RUNNER_TEMP/registry/attestations.json" \
            --tarball "$RUNNER_TEMP/registry/coding-x-$VERSION.tgz"
          mkdir -p "$RUNNER_TEMP/registry/signature-audit"
          npm install --prefix "$RUNNER_TEMP/registry/signature-audit" \
            --ignore-scripts --no-audit --no-fund "coding-x@$VERSION"
          npm audit signatures --prefix "$RUNNER_TEMP/registry/signature-audit"

      - name: Create or complete the immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          EVIDENCE="$RUNNER_TEMP/stage/candidate.json"
          TARBALL="$RUNNER_TEMP/registry/coding-x-$VERSION.tgz"
          if gh release view "$RELEASE_TAG" --json isDraft,isImmutable > "$RUNNER_TEMP/release-before.json" 2>/dev/null; then
            if jq -e '.isImmutable == true and .isDraft == false' "$RUNNER_TEMP/release-before.json" >/dev/null; then
              echo "Immutable release $RELEASE_TAG already exists; verifying it without mutation"
            elif jq -e '.isDraft == true' "$RUNNER_TEMP/release-before.json" >/dev/null; then
              gh release upload "$RELEASE_TAG" --clobber \
                "$EVIDENCE#Exact npm candidate evidence" \
                "$TARBALL#Exact npm registry tarball"
              gh release edit "$RELEASE_TAG" --draft=false --latest
            else
              echo "::error::Existing release is published but not immutable"
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
            gh release upload "$RELEASE_TAG" \
              "$EVIDENCE#Exact npm candidate evidence" \
              "$TARBALL#Exact npm registry tarball"
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi

      - name: Verify immutable release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          gh release view "$RELEASE_TAG" \
            --json isDraft,isImmutable,tagName,assets > "$RUNNER_TEMP/release.json"
          node - "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/stage/candidate.json" "$RUNNER_TEMP/registry/coding-x-$VERSION.tgz" <<'NODE'
          const crypto = require('node:crypto')
          const fs = require('node:fs')
          const [releasePath, evidencePath, tarballPath] = process.argv.slice(2)
          const release = JSON.parse(fs.readFileSync(releasePath, 'utf8'))
          if (release.isDraft || !release.isImmutable) throw new Error('GitHub Release is not published and immutable')
          const expected = new Map([
            ['candidate.json', evidencePath],
            [require('node:path').basename(tarballPath), tarballPath],
          ])
          for (const [name, path] of expected) {
            const asset = release.assets.find((entry) => entry.name === name)
            if (!asset) throw new Error(`Missing release asset ${name}`)
            const digest = `sha256:${crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex')}`
            if (asset.digest !== digest) throw new Error(`Release asset ${name} digest mismatch`)
          }
          NODE
          verified=false
          for attempt in $(seq 1 12); do
            if gh release verify "$RELEASE_TAG" --format json >/dev/null 2>&1 \
              && gh release verify-asset "$RELEASE_TAG" "$RUNNER_TEMP/stage/candidate.json" \
                --format json >/dev/null 2>&1 \
              && gh release verify-asset "$RELEASE_TAG" \
                "$RUNNER_TEMP/registry/coding-x-$VERSION.tgz" --format json >/dev/null 2>&1; then
              verified=true
              break
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          if [ "$verified" != true ]; then
            echo "::error::Immutable release attestation was not verifiable after 60 seconds"
            exit 1
          fi
