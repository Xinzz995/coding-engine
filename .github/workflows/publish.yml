name: Publish to npm

# 推送形如 v1.2.3 的 tag 时：发布到 npm 并创建 GitHub Release。
# 依赖仓库 Secret：NPM_TOKEN（npm 的 Automation token，可绕过 2FA）。
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 GitHub Release 需要
      id-token: write # 供 npm provenance 使用
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 需要完整历史 + tags 才能按提交生成 Release 说明

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # 防呆：tag 必须与 package.json 的 version 一致，否则中止
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json version $PKG 不一致"
            exit 1
          fi
          echo "版本一致：$PKG"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm 发布成功后创建 GitHub Release：用「上一个 tag 到本 tag」之间的提交作为说明
      # （本仓库直接提交到 main、无 PR，所以 --generate-notes 只会给出空白链接）
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")"
          if [ -n "$PREV" ]; then
            CHANGES="$(git log "${PREV}..${GITHUB_REF_NAME}" --no-merges --pretty='- %s (%h)')"
            COMPARE="**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}"
          else
            CHANGES="$(git log "${GITHUB_REF_NAME}" --no-merges --pretty='- %s (%h)')"
            COMPARE=""
          fi
          NOTES="$(printf '## 变更\n\n%s\n\n%s\n' "$CHANGES" "$COMPARE")"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$NOTES"
