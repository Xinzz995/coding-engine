name: Publish to npm

# 推送形如 v1.2.3 的 tag 时：发布到 npm 并创建 GitHub Release。
# 依赖仓库 Secret：NPM_TOKEN（npm 的 Automation token，可绕过 2FA）。
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 GitHub Release 需要
      checks: read # 核验对应 PR head 的交付检查
      pull-requests: read # 找到生成发布提交的已合并 PR
      id-token: write # 供 npm provenance 使用
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # 需要完整历史 + tags 才能按提交生成 Release 说明

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Verify the tagged commit comes from main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag 提交 $GITHUB_SHA 不在 origin/main 历史中"
            exit 1
          fi

      # 防呆：tag 必须与 package.json 及三个插件清单的 version 一致，否则中止
      # （0.6.0–0.7.1 期间插件清单曾漂移在 0.5.1——发版只 bump package.json 的教训）
      - name: Verify tag matches package.json and plugin manifests
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FAIL=0
          for f in package.json .claude-plugin/plugin.json .cursor-plugin/plugin.json .codex-plugin/plugin.json; do
            V="$(node -p "require('./$f').version")"
            if [ "$TAG" != "$V" ]; then
              echo "::error::tag v$TAG 与 $f 的 version $V 不一致"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] || exit 1
          echo "版本一致：$TAG（package.json + 3 个插件清单）"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Built CLI smoke
        run: |
          node dist/cli.js --help
          node dist/cli.js doctor

      - name: Dependency audit
        run: npm audit --audit-level=high

      # 首次自托管经历了显式记录的 bootstrap；从受管 workflow 已进入 tag 的版本开始，
      # 发布提交必须已取得契约列出的全部 required checks，或匹配未关闭的有界交付异常。
      # 读取完整 ruleset（包括 bypass_actors）必须使用显式管理凭据；缺失时 fail closed。
      - name: Verify delivery checks for self-hosted releases
        if: hashFiles('.github/workflows/coding-x-review.yml') != ''
        env:
          GH_TOKEN: ${{ secrets.CODING_X_ADMIN_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls?per_page=100" \
            -H "Accept: application/vnd.github+json" \
            > "$RUNNER_TEMP/associated-prs.json"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const contract = JSON.parse(readFileSync('.coding-x/quality.json', 'utf8'));
          const prs = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/associated-prs.json', 'utf8'));
          const matches = Array.isArray(prs) ? prs.filter((pr) =>
            pr?.merged_at
            && pr?.base?.ref === contract.github.defaultBranch
            && pr?.merge_commit_sha === process.env.GITHUB_SHA
            && typeof pr?.head?.sha === 'string') : [];
          if (matches.length !== 1) {
            console.error(`::error::发布提交必须对应默认分支上恰好一个合并结果，实际 ${matches.length}`);
            process.exit(1);
          }
          writeFileSync(
            process.env.RUNNER_TEMP + '/delivery-head.txt',
            matches[0].head.sha,
          );
          console.log(`发布提交对应 PR #${matches[0].number} head ${matches[0].head.sha}`);
          NODE
          DELIVERY_HEAD="$(cat "$RUNNER_TEMP/delivery-head.txt")"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${DELIVERY_HEAD}/check-runs?per_page=100" \
            > "$RUNNER_TEMP/check-runs.json"
          gh api "repos/${GITHUB_REPOSITORY}/rulesets?includes_parents=false&per_page=100" \
            > "$RUNNER_TEMP/rulesets.json"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const rulesets = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/rulesets.json', 'utf8'));
          for (const [name, destination] of [
            ['coding-x quality gate', 'branch-ruleset-id.txt'],
            ['coding-x release refs', 'release-ruleset-id.txt'],
          ]) {
            const matches = Array.isArray(rulesets) ? rulesets.filter((item) => item?.name === name) : [];
            if (matches.length !== 1 || !Number.isInteger(matches[0]?.id)) {
              console.error(`::error::发布时必须恰好存在一个 ${name}，实际 ${matches.length}`);
              process.exit(1);
            }
            writeFileSync(process.env.RUNNER_TEMP + '/' + destination, String(matches[0].id));
          }
          NODE
          BRANCH_RULESET_ID="$(cat "$RUNNER_TEMP/branch-ruleset-id.txt")"
          RELEASE_RULESET_ID="$(cat "$RUNNER_TEMP/release-ruleset-id.txt")"
          gh api "repos/${GITHUB_REPOSITORY}/rulesets/${BRANCH_RULESET_ID}" \
            > "$RUNNER_TEMP/branch-ruleset.json"
          gh api "repos/${GITHUB_REPOSITORY}/rulesets/${RELEASE_RULESET_ID}" \
            > "$RUNNER_TEMP/release-ruleset.json"
          node build/verify-release-delivery.mjs \
            .coding-x/quality.json \
            .coding-x/exceptions.json \
            "$RUNNER_TEMP/associated-prs.json" \
            "$RUNNER_TEMP/check-runs.json" \
            "$RUNNER_TEMP/branch-ruleset.json" \
            "$RUNNER_TEMP/release-ruleset.json" \
            "$GITHUB_SHA"

      # 允许 tag workflow 安全重跑：版本已存在时必须证明它就是当前 tag 的产物，
      # 不能把同版本的其他提交静默当成成功。
      - name: Check whether npm version already exists
        id: npm_version
        shell: bash
        run: |
          PACKAGE="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"

          set +e
          VIEW_OUTPUT="$(npm view "${PACKAGE}@${VERSION}" version 2>&1)"
          VIEW_CODE=$?
          set -e

          if [ "$VIEW_CODE" -eq 0 ]; then
            PUBLISHED_GIT_HEAD="$(npm view "${PACKAGE}@${VERSION}" gitHead)"
            if [ "$PUBLISHED_GIT_HEAD" != "$GITHUB_SHA" ]; then
              echo "::error::${PACKAGE}@${VERSION} 已存在，但 gitHead ${PUBLISHED_GIT_HEAD:-<缺失>} 与当前 tag 提交 $GITHUB_SHA 不一致"
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE}@${VERSION} 已由当前 tag 提交发布，跳过重复 publish"
          elif [[ "$VIEW_OUTPUT" == *"E404"* ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE}@${VERSION} 尚未发布"
          else
            echo "::error::无法确认 ${PACKAGE}@${VERSION} 是否已发布"
            printf '%s\n' "$VIEW_OUTPUT"
            exit "$VIEW_CODE"
          fi

      - name: Publish to npm
        if: steps.npm_version.outputs.exists != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm 发布成功后创建 GitHub Release：用「上一个 tag 到本 tag」之间的提交作为说明
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")"
          if [ -n "$PREV" ]; then
            CHANGES="$(git log "${PREV}..${GITHUB_REF_NAME}" --no-merges --pretty='- %s (%h)')"
            COMPARE="**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}"
          else
            CHANGES="$(git log "${GITHUB_REF_NAME}" --no-merges --pretty='- %s (%h)')"
            COMPARE=""
          fi
          NOTES="$(printf '## 变更\n\n%s\n\n%s\n' "$CHANGES" "$COMPARE")"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} 已存在，跳过重复创建"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$NOTES"
          fi
