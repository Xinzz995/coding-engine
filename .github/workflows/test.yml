name: Test

# 常态 CI：每次推送 main 与 PR 都跑 typecheck + 全套测试 + docs 知识库健康检查。
# 版本一致性不变量（build/version-consistency.test.mjs）随 npm test 执行——
# 插件清单曾在 0.5.1 停了三个版本无人发现（此前只有发版 tag 门禁，平时无 CI），
# 此 workflow 让第一个漂移提交就红。tag 推送由 publish.yml 覆盖，这里不重复。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # doctor 新鲜度检查按文件比对 git 最后提交日期；shallow clone 会把
          # 全部文件的最后提交误判为 HEAD 日期，导致过期判定整体失真。
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # 过期文档检测常态化（0.7.0 起 doctor 具备该能力，此前仅本地手动跑）：
      # frontmatter 完整性 / updated 新鲜度 / AGENTS.md 索引 / 相对链接，问题即红。
      - name: Docs doctor
        run: npm run dev -- doctor --local
