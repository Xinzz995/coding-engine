name: Rebuild Windows native helpers for current PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  generate:
    name: generate / windows-native-helpers
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build exact supervisor bytes twice
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          & pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File native/windows-supervisor/build.ps1 `
            -Mode Generate `
            -Target Supervisor `
            -OutputDirectory "$env:RUNNER_TEMP/windows-native/supervisor" `
            -SourceCommit $env:SOURCE_COMMIT
      - name: Build exact path inspector bytes twice
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          & pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File native/windows-supervisor/build.ps1 `
            -Mode Generate `
            -Target PathInspector `
            -OutputDirectory "$env:RUNNER_TEMP/windows-native/path-inspector" `
            -SourceCommit $env:SOURCE_COMMIT
      - name: Preserve exact generated bytes and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-native-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/windows-native
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
