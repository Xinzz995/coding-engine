name: Temporary Windows Supervisor Build

on:
  push:
    branches: ['codex/bounded-supervisor-deadlines']

permissions:
  contents: read

jobs:
  generate:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate deterministic supervisor artifact
        shell: pwsh
        run: >-
          & 'pwsh' '-NoLogo' '-NoProfile' '-NonInteractive' '-ExecutionPolicy' 'Bypass'
          '-File' 'native/windows-supervisor/build.ps1'
          '-Mode' 'Generate'
          '-Target' 'Supervisor'
          '-OutputDirectory' 'windows-supervisor-artifact'
          '-SourceCommit' '${{ github.sha }}'
      - name: Upload generated artifact and manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-supervisor-${{ github.sha }}
          path: windows-supervisor-artifact
          if-no-files-found: error
          retention-days: 1
