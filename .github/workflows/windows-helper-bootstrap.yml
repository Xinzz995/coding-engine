name: Windows Helper Bootstrap

# Temporary bootstrap only: produce the first reviewable Windows helper artifact.
# Remove this workflow after the exact executable is committed and the permanent
# reproducibility check is enabled in the quality contract.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build-windows-helper:
    name: build Windows helper candidate
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out the exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up the locked .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: native/windows-supervisor/global.json

      - name: Build the deterministic candidate
        shell: pwsh
        env:
          OUTPUT_DIRECTORY: ${{ runner.temp }}\coding-x-windows-supervisor
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          & ./native/windows-supervisor/build.ps1 `
            -Mode Generate `
            -OutputDirectory $env:OUTPUT_DIRECTORY `
            -SourceCommit $env:SOURCE_COMMIT

      - name: Upload the commit-bound candidate
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-supervisor-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/coding-x-windows-supervisor/coding-x-windows-supervisor.exe
            ${{ runner.temp }}/coding-x-windows-supervisor/SHA256SUMS
            ${{ runner.temp }}/coding-x-windows-supervisor/build-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Record the uploaded artifact identity
        shell: pwsh
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          @"
          Windows helper bootstrap artifact

          - Source commit: ``$env:SOURCE_COMMIT``
          - Artifact ID: ``$env:ARTIFACT_ID``
          - Artifact digest: ``$env:ARTIFACT_DIGEST``
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
