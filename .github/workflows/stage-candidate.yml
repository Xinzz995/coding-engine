name: Stage verified npm candidate
run-name: Stage coding-x@${{ inputs.version }} from candidate run ${{ inputs.candidate_run_id }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version in the verified candidate artifact (for example 0.33.0)
        required: true
        type: string
      candidate_run_id:
        description: Successful Build release candidate run already used by all Dogfood projects
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: npm-stage-coding-x
  cancel-in-progress: false

jobs:
  stage:
    name: submit selected candidate through stage-only OIDC
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-staging
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
      CANDIDATE_WORKFLOW_RUN_ID: ${{ inputs.candidate_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            build/release-evidence.mjs
            build/sync-plugin-versions.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify selected candidate run and current main identity
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_REF: ${{ github.ref }}
          CURRENT_MAIN_COMMIT: ${{ github.sha }}
        run: |
          case "$CANDIDATE_WORKFLOW_RUN_ID" in
            ''|*[!0-9]*) echo "::error::Candidate run ID must contain digits only"; exit 1 ;;
          esac
          if [ "$SELECTED_REF" != refs/heads/main ]; then
            echo "::error::Staging must run from refs/heads/main"
            exit 1
          fi
          REMOTE_MAIN_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$CURRENT_MAIN_COMMIT" != "$REMOTE_MAIN_COMMIT" ]; then
            echo "::error::Selected workflow commit is no longer the current remote main"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_WORKFLOW_RUN_ID" \
            > "$RUNNER_TEMP/candidate-run.json"
          node build/release-evidence.mjs verify-candidate-run \
            --run-json "$RUNNER_TEMP/candidate-run.json" \
            --candidate-workflow-run-id "$CANDIDATE_WORKFLOW_RUN_ID" \
            --commit "$CURRENT_MAIN_COMMIT"

      - name: Download the selected candidate without project dependencies
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-candidate-${{ inputs.version }}
          path: ${{ runner.temp }}/npm-candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Verify and reconstruct the non-executable candidate
        env:
          CURRENT_MAIN_COMMIT: ${{ github.sha }}
        run: |
          node build/release-evidence.mjs verify-tarball \
            --evidence "$RUNNER_TEMP/npm-candidate/packed.json" \
            --tarball "$RUNNER_TEMP/npm-candidate/coding-x-$EXPECTED_VERSION.tgz"
          jq -e --arg version "$EXPECTED_VERSION" --arg commit "$CURRENT_MAIN_COMMIT" '
            .schemaVersion == 2 and
            .status == "packed" and
            .version == $version and
            .commit == $commit and
            .candidateWorkflowRunId == $ENV.CANDIDATE_WORKFLOW_RUN_ID
          ' "$RUNNER_TEMP/npm-candidate/packed.json" >/dev/null
          mkdir -p "$RUNNER_TEMP/stage-package"
          tar -xzf "$RUNNER_TEMP/npm-candidate/coding-x-$EXPECTED_VERSION.tgz" \
            -C "$RUNNER_TEMP/stage-package"
          test -f "$RUNNER_TEMP/stage-package/package/package.json"
          mkdir -p "$RUNNER_TEMP/stage-package/package/.git"
          printf '%s\n' "$CURRENT_MAIN_COMMIT" > "$RUNNER_TEMP/stage-package/package/.git/HEAD"

      - name: Submit the verified bytes through stage-only npm OIDC
        env:
          CURRENT_MAIN_COMMIT: ${{ github.sha }}
          STAGE_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          # No project dependency or lifecycle script runs in this OIDC-enabled job.
          npm stage publish "$RUNNER_TEMP/stage-package/package" \
            --ignore-scripts --tag next --access public --provenance --json \
            > "$RUNNER_TEMP/npm-candidate/stage.json"
          node build/release-evidence.mjs record-stage \
            --candidate "$RUNNER_TEMP/npm-candidate/packed.json" \
            --commit "$CURRENT_MAIN_COMMIT" \
            --candidate-workflow-run-id "$CANDIDATE_WORKFLOW_RUN_ID" \
            --stage-workflow-run-id "$STAGE_WORKFLOW_RUN_ID" \
            --require-node-major 24 \
            --min-npm 11.15.0 \
            --stage-json "$RUNNER_TEMP/npm-candidate/stage.json" \
            --output "$RUNNER_TEMP/npm-candidate/candidate.json"

      - name: Preserve stage identity and exact-byte evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-stage-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/npm-candidate/candidate.json
            ${{ runner.temp }}/npm-candidate/stage.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Write maintainer handoff
        run: |
          node - "$RUNNER_TEMP/npm-candidate/candidate.json" "$GITHUB_STEP_SUMMARY" <<'NODE'
          const fs = require('node:fs')
          const [evidencePath, summaryPath] = process.argv.slice(2)
          const evidence = JSON.parse(fs.readFileSync(evidencePath, 'utf8'))
          fs.appendFileSync(summaryPath, [
            '## verified npm candidate staged',
            '',
            `- package: ${evidence.packageName}@${evidence.version}`,
            `- commit: ${evidence.commit}`,
            `- candidate run ID: ${evidence.candidateWorkflowRunId}`,
            `- stage run ID: ${evidence.stageWorkflowRunId}`,
            `- stage ID: ${evidence.stageId}`,
            `- tarball SHA-256: ${evidence.tarball.sha256}`,
            `- requested tag after 2FA approval: ${evidence.requestedTag}`,
            '',
            'Verify the stage identity before 2FA approval.',
            '',
          ].join('\n'))
          NODE
