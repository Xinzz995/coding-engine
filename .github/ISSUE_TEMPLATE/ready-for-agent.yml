# Generated from .coding-x/quality.json. Change the contract, then regenerate.
name: 'Agent 执行任务'
description: '建立一个可由 coding-x 显式启动的单 Issue、单分支、单 PR 任务'
title: ''
body:
  - type: markdown
    attributes:
      value: '填写并人工确认后再添加 ready-for-agent 标签；创建 Issue 本身不会启动运行。'
  - type: textarea
    id: goal
    attributes:
      label: 本次目标
      description: 本次改动必须完成的行为
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: 明确的非目标
      description: 本次刻意不处理的内容
    validations:
      required: true
  - type: textarea
    id: execution-contract
    attributes:
      label: 执行合同
      description: 只填写 Story 语义标准、稳定 check id 与模式；本地可 scoped/full，远端当前只支持 scoped；固定责任字段不得改写
      value: |
        ```json
        {
          "schemaVersion": 1,
          "storyAcceptance": {
            "evidenceSource": "validator",
            "network": "disabled",
            "criteria": []
          },
          "localChecks": {
            "evidenceSource": "engine",
            "network": "current-host",
            "mode": "scoped",
            "checkIds": []
          },
          "remoteDelivery": {
            "evidenceSource": "github",
            "network": "github-actions",
            "mode": "scoped",
            "checkIds": [],
            "ruleset": "required"
          },
          "runMetrics": {
            "evidenceSource": "engine-clock",
            "metrics": ["ready-to-trusted", "active", "waiting", "continuations"]
          }
        }
        ```
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 风险说明
      description: 影响范围、回退方式、数据或兼容性风险
    validations:
      required: true
