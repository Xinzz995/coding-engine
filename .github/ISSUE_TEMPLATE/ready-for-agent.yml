      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 每行一个可判定条目，使用 Markdown 列表
      placeholder: '- 第一个可判定结果'
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 风险说明
      description: 影响范围、回退方式、数据或兼容性风险
    validations:
      required: true
