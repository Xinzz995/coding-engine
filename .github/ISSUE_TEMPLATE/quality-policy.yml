# Generated from .coding-x/quality.json. Change the contract, then regenerate.
name: '质量政策例外'
description: '登记一次有期限的质量政策变更例外'
title: '[政策例外] '
labels:
  - 'quality-policy-exception'
body:
  - type: input
    id: owner
    attributes:
      label: 负责人
      description: 对后续处理负责的 GitHub 用户名或团队
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 原因
      description: 为什么现在不能按正常规则完成
    validations:
      required: true
  - type: input
    id: expiry
    attributes:
      label: 到期日
      description: YYYY-MM-DD，最长 7 天
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: textarea
    id: follow-up
    attributes:
      label: 跟进事项
      description: 明确的修复或恢复正常规则事项
    validations:
      required: true
